workflows:

  ios-release:
    name: iOS Release (IPA)
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      node: 22
      vars:
        BUNDLE_ID: com.hatovblitafrit.hatovblitafrit

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates

      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build IPA
        script: |
          # Find the downloaded provisioning profile and extract its name
          PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          security cms -D -i "$PROFILE" > /tmp/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          echo "Using provisioning profile: $PROFILE_NAME"

          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "DEVELOPMENT_TEAM=AG8NCXSNC8 CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME} CODE_SIGN_IDENTITY='iPhone Distribution'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # publishing:
