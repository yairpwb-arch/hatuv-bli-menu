workflows:

  # ────────────────────────────────────────────────────────────────
  # Android — builds a signed AAB ready for Google Play
  # ────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release (AAB)
    max_build_duration: 60  # minutes
    instance_type: mac_mini_m2

    environment:
      # ── Java ──
      java: 17

      # ── Android code-signing ──
      # Add these in Codemagic → App settings → Environment variables:
      #   CM_KEYSTORE         – base64-encoded .jks / .keystore file
      #   CM_KEYSTORE_PASSWORD
      #   CM_KEY_ALIAS
      #   CM_KEY_PASSWORD
      android_signing:
        - hatuv_keystore          # name you give the keystore in Codemagic UI

      # ── Node & npm ──
      node: 20

    scripts:
      # 1. Install JS dependencies
      - name: Install dependencies
        script: npm ci

      # 2. Build the Vite web bundle
      - name: Build web app
        script: npm run build

      # 3. Sync web assets → Android
      - name: Capacitor sync
        script: npx cap sync android

      # 4. Build signed Android App Bundle
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="${CM_KEYSTORE_PATH}" \
            -Pandroid.injected.signing.store.password="${CM_KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${CM_KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${CM_KEY_PASSWORD}"

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt

    # ── Optional: publish straight to Google Play internal track ──
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true

  # ────────────────────────────────────────────────────────────────
  # Android — debug APK for quick testing (no signing needed)
  # ────────────────────────────────────────────────────────────────
  android-debug:
    name: Android Debug (APK)
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      java: 17
      node: 20

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync android

      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
